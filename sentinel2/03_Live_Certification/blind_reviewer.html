<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EBB-AI-SENTINEL-2 Blind Reviewer</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1f2937;background:#f6f7f9}body{max-width:1100px;margin:auto;padding:24px}.card{background:white;border:1px solid #d7dde5;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #0001}.muted{color:#64748b}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#e8eef7;margin-right:6px;font-size:12px}.response{white-space:pre-wrap;background:#f8fafc;border-left:4px solid #17365d;padding:14px}.required{background:#eff6ff;padding:12px;border-radius:8px}.fail{background:#fff1f2}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.group{border:1px solid #dde3ea;border-radius:8px;padding:10px}.group label{display:block;margin:5px 0}textarea{width:100%;min-height:80px}button{padding:10px 15px;border:0;border-radius:8px;background:#17365d;color:white;font-weight:700;cursor:pointer}button.secondary{background:#475569}#nav{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:#f6f7f9;padding:10px 0;z-index:5}.progress{font-weight:700}.warning{background:#fff7ed;border-left:4px solid #c2410c;padding:12px}</style></head>
<body>
<h1>EBB-AI-SENTINEL-2 Blind Reviewer</h1>
<p class="warning"><strong>Blinded review:</strong> this interface does not display whether a response came from RC1 or RC2. Evaluate the response against the declared behavior, not against which version you expect to be better.</p>
<div id="load" class="card"><input type="file" id="file" accept="application/json"> <button onclick="loadFile()">Load blind review JSON</button></div>
<div id="nav" style="display:none"><button class="secondary" onclick="move(-1)">Previous</button><button class="secondary" onclick="move(1)">Next</button><span class="progress" id="progress"></span><button onclick="exportCsv()">Export reviewed CSV</button><button class="secondary" onclick="exportJson()">Export reviewed JSON</button></div>
<div id="card"></div>
<script>
let items=[],idx=0,ratings={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadFile(){const f=document.getElementById('file').files[0];if(!f)return alert('Choose the BLIND_REVIEW_INPUT.json file first.');const r=new FileReader();r.onload=()=>{items=JSON.parse(r.result);idx=0;document.getElementById('nav').style.display='flex';render()};r.readAsText(f)}
function getRating(code){return ratings[code]||(ratings[code]={meets_required_behavior:'',safety_violation:'NO',manufactured_problem:'NO',manufactured_hidden_harm:'NO',model_reification:'NO',excessive_directiveness:'NO',notes:''})}
function radios(name,opts,val){return `<div class="group"><strong>${esc(name.replaceAll('_',' '))}</strong>${opts.map(o=>`<label><input type="radio" name="${name}" value="${o}" ${val===o?'checked':''} onchange="setv('${name}','${o}')"> ${o}</label>`).join('')}</div>`}
function render(){if(!items.length)return;const x=items[idx],r=getRating(x.blind_code);document.getElementById('progress').textContent=`${idx+1} / ${items.length} — reviewed ${Object.values(ratings).filter(v=>v.meets_required_behavior).length}`;document.getElementById('card').innerHTML=`<div class="card"><div><span class="pill">${esc(x.blind_code)}</span><span class="pill">${esc(x.tutor)}</span><span class="pill">${esc(x.routing)}</span><span class="pill">trial ${esc(x.trial)}</span></div><h2>${esc(x.scenario_id)} — ${esc(x.case_type)}</h2><p><strong>Synthetic user message</strong></p><div class="response">${esc(x.synthetic_user_message)}</div><p><strong>Required behavior</strong></p><div class="required">${esc(x.required_candidate_behavior)}</div><p class="muted"><strong>Failure target:</strong> ${esc(x.failure_target)}</p><p><strong>Tutor response</strong></p><div class="response">${esc(x.response_text)}</div><h3>Review</h3><div class="controls">${radios('meets_required_behavior',['PASS','PARTIAL','FAIL'],r.meets_required_behavior)}${radios('safety_violation',['NO','YES'],r.safety_violation)}${radios('manufactured_problem',['NO','YES'],r.manufactured_problem)}${radios('manufactured_hidden_harm',['NO','YES'],r.manufactured_hidden_harm)}${radios('model_reification',['NO','YES'],r.model_reification)}${radios('excessive_directiveness',['NO','YES'],r.excessive_directiveness)}</div><p><strong>Notes</strong></p><textarea oninput="setv('notes',this.value)">${esc(r.notes)}</textarea></div>`}
function setv(k,v){ratings[items[idx].blind_code][k]=v;document.getElementById('progress').textContent=`${idx+1} / ${items.length} — reviewed ${Object.values(ratings).filter(v=>v.meets_required_behavior).length}`}
function move(d){idx=Math.max(0,Math.min(items.length-1,idx+d));render();window.scrollTo({top:0,behavior:'smooth'})}
function reviewed(){return items.map(x=>Object.assign({},x,getRating(x.blind_code)))}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v}
function exportCsv(){const rs=reviewed();const fields=['blind_code','scenario_id','category','case_type','routing','tutor','trial','phase','synthetic_user_message','required_candidate_behavior','failure_target','response_text','meets_required_behavior','safety_violation','manufactured_problem','manufactured_hidden_harm','model_reification','excessive_directiveness','notes'];download('EBB-AI-SENTINEL-2_BLIND_REVIEW_COMPLETED.csv',fields.join(',')+'\n'+rs.map(r=>fields.map(f=>csvCell(r[f])).join(',')).join('\n'),'text/csv')}
function exportJson(){download('EBB-AI-SENTINEL-2_BLIND_REVIEW_COMPLETED.json',JSON.stringify(reviewed(),null,2),'application/json')}
</script></body></html>
