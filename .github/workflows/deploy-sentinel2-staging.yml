name: Deploy SENTINEL-2 Staging

on:
  workflow_dispatch:
    inputs:
      current_version:
        description: "Version to expose at the current/rehearsal paths"
        required: true
        default: rc2
        type: choice
        options:
          - rc2
          - rc1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sentinel2-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify frozen archive hashes
        run: |
          echo "35545be196498a578813f660a107dcb4d911295aaa5ae1a852ae73167e6983f0  sentinel2/01_Frozen_Builds/EBB-AI-SENTINEL-2_EXAMINED_RC1_BASELINE.zip" | sha256sum -c -
          echo "25b3db9cd9b05e37e2198a197a51f432821fa154a1300c7ff1ff8903f55753df  sentinel2/01_Frozen_Builds/EBB-AI-SENTINEL-2_NAVIGATOR_RC1_BASELINE.zip" | sha256sum -c -
          echo "8cef138c4407923df638b127a60d9a0d463b044fd96b87b062761d599591f00f  sentinel2/01_Frozen_Builds/EBB-AI-SENTINEL-2_EXAMINED_RC2_FROZEN_CANDIDATE.zip" | sha256sum -c -
          echo "09e215fec74b6f6850b5fa943032c3252a3198198eeb49bdf84483f1e4e62303  sentinel2/01_Frozen_Builds/EBB-AI-SENTINEL-2_NAVIGATOR_RC2_FROZEN_CANDIDATE.zip" | sha256sum -c -

      - name: Build exact staging site
        run: |
          rm -rf site tmp

          mkdir -p \
            site/examined-rc1 \
            site/examined-rc2 \
            site/navigator-rc1 \
            site/navigator-rc2 \
            site/examined-current \
            site/navigator-current \
            site/reviewer \
            tmp/ex1 \
            tmp/ex2 \
            tmp/nav1 \
            tmp/nav2

          unzip -q sentinel2/01_Frozen_Builds/EBB-AI-SENTINEL-2_EXAMINED_RC1_BASELINE.zip -d tmp/ex1
          unzip -q sentinel2/01_Frozen_Builds/EBB-AI-SENTINEL-2_EXAMINED_RC2_FROZEN_CANDIDATE.zip -d tmp/ex2
          unzip -q sentinel2/01_Frozen_Builds/EBB-AI-SENTINEL-2_NAVIGATOR_RC1_BASELINE.zip -d tmp/nav1
          unzip -q sentinel2/01_Frozen_Builds/EBB-AI-SENTINEL-2_NAVIGATOR_RC2_FROZEN_CANDIDATE.zip -d tmp/nav2

          cp -a tmp/ex1/Examined-main/. site/examined-rc1/
          cp -a tmp/ex2/Examined-main/. site/examined-rc2/
          cp -a tmp/nav1/SPC-FALL-2026-Navigator-main/. site/navigator-rc1/
          cp -a tmp/nav2/SPC-FALL-2026-Navigator-main/. site/navigator-rc2/

          if [ "${{ inputs.current_version }}" = "rc1" ]; then
            cp -a site/examined-rc1/. site/examined-current/
            cp -a site/navigator-rc1/. site/navigator-current/
          else
            cp -a site/examined-rc2/. site/examined-current/
            cp -a site/navigator-rc2/. site/navigator-current/
          fi

          cp sentinel2/03_Live_Certification/blind_reviewer.html site/reviewer/index.html

          touch site/.nojekyll

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>EBB-AI-SENTINEL-2 Staging</title>
          </head>
          <body>
            <h1>EBB-AI-SENTINEL-2 Staging</h1>

            <p>
              Synthetic certification environment only.
              Do not enter real student or private autobiographical data.
            </p>

            <h2>Current rehearsal version</h2>
            <p><a href="./examined-current/">Examined — current rehearsal</a></p>
            <p><a href="./navigator-current/">Navigator — current rehearsal</a></p>

            <h2>Frozen comparison builds</h2>
            <p><a href="./examined-rc1/">Examined RC1 baseline</a></p>
            <p><a href="./examined-rc2/">Examined RC2 Sentinel candidate</a></p>
            <p><a href="./navigator-rc1/">Navigator RC1 baseline</a></p>
            <p><a href="./navigator-rc2/">Navigator RC2 Sentinel candidate</a></p>

            <h2>Certification</h2>
            <p><a href="./reviewer/">Blind tutor-response reviewer</a></p>
          </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
