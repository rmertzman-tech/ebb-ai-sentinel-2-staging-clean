name: EBB AI SENTINEL-10A RC2.8-vs-RC2.9 Production-Compatible Live Certification

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Production-compatible tutor proxy endpoint'
        required: true
        default: 'https://ucp-backend-4dig.onrender.com/api/claude-proxy'

permissions:
  contents: read

concurrency:
  group: sentinel11a-live-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preflight locked identities, request parity, and 147-record plan
        run: python EBB-AI-SENTINEL-11A/03_Live_Harness/run_sentinel11a_preflight.py

      - name: Run full RC2.8 vs RC2.9 certification
        run: |
          python EBB-AI-SENTINEL-11A/03_Live_Harness/run_live_paired_certification.py \
            --mode full \
            --endpoint "${{ inputs.endpoint }}" \
            --output-dir sentinel11a-live-results

      - name: Validate exact live corpus and hidden-key reconciliation
        run: |
          python EBB-AI-SENTINEL-11A/03_Live_Harness/validate_live_results.py \
            --results-dir sentinel11a-live-results

      - name: Package strict blind and custodian artifacts separately
        run: |
          python EBB-AI-SENTINEL-11A/03_Live_Harness/package_separated_artifacts.py \
            --results-dir sentinel11a-live-results \
            --harness-dir EBB-AI-SENTINEL-11A/03_Live_Harness \
            --out-dir sentinel11a-artifacts

      - name: Upload strict blind-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel11a-blind-review
          path: sentinel11a-artifacts/sentinel11a-blind-review.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload custodian results
        uses: actions/upload-artifact@v4
        with:
          name: sentinel11a-custodian-results
          path: sentinel11a-artifacts/sentinel11a-custodian-results.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload separation receipt
        uses: actions/upload-artifact@v4
        with:
          name: sentinel11a-separation-receipt
          path: sentinel11a-artifacts/EBB-AI-SENTINEL-11A_ARTIFACT_SEPARATION_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics if execution/validation failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel11a-custodian-failure-diagnostics
          path: |
            sentinel11a-live-results/**
            EBB-AI-SENTINEL-11A/05_QA/**
          if-no-files-found: warn
          retention-days: 14
