name: EBB AI SENTINEL-4A RC2.1-vs-RC2.2 Production-Compatible Live Certification

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Production-compatible tutor proxy endpoint'
        required: true
        default: 'https://ucp-backend-4dig.onrender.com/api/claude-proxy'

permissions:
  contents: read

concurrency:
  group: sentinel4a-live-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preflight locked identities, request parity, and 147-record plan
        run: python EBB-AI-SENTINEL-4A/03_Live_Harness/run_sentinel4a_preflight.py

      - name: Run full RC2.1 vs RC2.2 certification
        run: |
          python EBB-AI-SENTINEL-4A/03_Live_Harness/run_live_paired_certification.py \
            --mode full \
            --endpoint "${{ inputs.endpoint }}" \
            --output-dir sentinel4a-live-results

      - name: Validate exact live corpus and hidden-key reconciliation
        run: |
          python EBB-AI-SENTINEL-4A/03_Live_Harness/validate_live_results.py \
            --results-dir sentinel4a-live-results

      - name: Package strict blind and custodian artifacts separately
        run: |
          python EBB-AI-SENTINEL-4A/03_Live_Harness/package_separated_artifacts.py \
            --results-dir sentinel4a-live-results \
            --harness-dir EBB-AI-SENTINEL-4A/03_Live_Harness \
            --out-dir sentinel4a-artifacts

      - name: Upload strict blind-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel4a-blind-review
          path: sentinel4a-artifacts/sentinel4a-blind-review.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload custodian results
        uses: actions/upload-artifact@v4
        with:
          name: sentinel4a-custodian-results
          path: sentinel4a-artifacts/sentinel4a-custodian-results.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload separation receipt
        uses: actions/upload-artifact@v4
        with:
          name: sentinel4a-separation-receipt
          path: sentinel4a-artifacts/EBB-AI-SENTINEL-4A_ARTIFACT_SEPARATION_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics if execution/validation failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel4a-custodian-failure-diagnostics
          path: |
            sentinel4a-live-results/**
            EBB-AI-SENTINEL-4A/05_QA/**
          if-no-files-found: warn
          retention-days: 14
